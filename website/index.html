<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Epik</title>
  <meta name="description" content="You say it. We make it.">
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#fafafa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #0a0a0a;
      --muted: #737373;
      --faint: #a3a3a3;
      --accent: #00b377;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      color: var(--fg);
      font-family: "Geist", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 1rem;
      text-align: center;
    }
    h1 {
      font-size: 3.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    hr {
      width: 4rem;
      border: none;
      border-top: 2px solid var(--accent);
    }
    .tagline {
      font-size: 1.25rem;
      font-style: italic;
      color: var(--muted);
    }
    .logo {
      margin-top: 0.75rem;
      height: 3rem;
      width: 3rem;
    }
    .download {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .download h2 {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .platforms {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
    }
    .platforms a {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      border: 1px solid var(--faint);
      border-radius: 0.5rem;
      color: var(--fg);
      font-weight: 500;
      text-decoration: none;
    }
    .platforms a:hover,
    .platforms a:focus-visible {
      border-color: var(--accent);
    }
    .platforms a .file {
      display: block;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
    }
    .platforms a.yours {
      border-color: var(--accent);
      background-color: var(--accent);
      color: var(--bg);
    }
    .platforms a.yours .file {
      color: var(--bg);
    }
    .next,
    .all {
      font-size: 0.875rem;
      color: var(--muted);
    }
    .all a {
      color: var(--muted);
    }
    footer {
      padding-bottom: 2rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--faint);
    }
  </style>
</head>
<body>
  <main>
    <h1>Epik</h1>
    <hr>
    <p class="tagline">You say it. We make it.</p>
    <img class="logo" src="brand/logo-mark-light.svg" alt="Epik logo">
    <section class="download" id="download" aria-labelledby="download-heading">
      <h2 id="download-heading">Download Epik</h2>
      <!-- The file names are the ones .github/workflows/release.yml uploads. -->
      <div class="platforms">
        <a data-os="mac" href="https://github.com/epik-agent/Epik/releases/latest/download/Epik.dmg">macOS<span class="file">Epik.dmg</span></a>
        <a data-os="windows" href="https://github.com/epik-agent/Epik/releases/latest/download/Epik.msi">Windows<span class="file">Epik.msi</span></a>
        <a data-os="linux" href="https://github.com/epik-agent/Epik/releases/latest/download/Epik_amd64.AppImage">Linux<span class="file">AppImage</span></a>
        <a data-os="linux" href="https://github.com/epik-agent/Epik/releases/latest/download/Epik_amd64.deb">Linux<span class="file">.deb (Debian, Ubuntu)</span></a>
      </div>
      <p class="next">Open it and follow the setup checklist.</p>
      <p class="all"><a href="https://github.com/epik-agent/Epik/releases">All releases</a></p>
    </section>
  </main>
  <footer>
    <p>&copy; <span id="year">2026</span> Epik</p>
  </footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    // Highlight the visitor's platform. Every button works without this.
    (function () {
      var ua = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent;
      var os = /mac/i.test(ua) ? "mac" : /win/i.test(ua) ? "windows" : /linux|x11/i.test(ua) && !/android/i.test(navigator.userAgent) ? "linux" : null;
      if (!os) return;
      document.querySelectorAll('.platforms a[data-os="' + os + '"]').forEach(function (a) {
        a.classList.add("yours");
      });
    })();
  </script>
</body>
</html>

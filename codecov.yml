# Coverage is a reading, not a gate. The status checks below inform a pull
# request and never fail it: a number that blocks a merge gets gamed with
# tests written for the number, which is worse than not measuring.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# The two crates are measured separately because they are separate
# workspaces built for different targets, and a single number over both
# would average a library against a browser page.
flag_management:
  default_rules:
    carryforward: true

comment:
  layout: "condensed_header, flags, files"
  # A comment on every push buries the diff it is commenting on.
  require_changes: true

ignore:
  # Generated by the Tauri build, not written here.
  - "crates/tauri/backend/gen/**"
  # The chores, which have no tests and want none.
  - "xtask/**"

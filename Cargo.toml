[workspace]
# `crates/epik-ui` is deliberately absent: it targets wasm32 and is built by
# Trunk, so it carries its own workspace and lockfile.
members = ["crates/epik", "crates/epik-app"]
exclude = ["crates/epik-ui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Every crate inherits one lint policy by writing `[lints] workspace = true`.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"

[workspace.dependencies]
epik = { path = "crates/epik" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

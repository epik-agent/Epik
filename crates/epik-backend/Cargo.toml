[package]
name = "epik-backend"
version = "0.1.0"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on Windows.
name = "epik_backend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
epik = { path = "../epik", features = ["native"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
anyhow = "1"

[package]
name = "epik-backend"
version = "0.1.0"
edition = "2024"

# The binary carries the product name: macOS reads the running process's name
# into "About …", "Hide …" and "Quit …", and a dev build runs outside a bundle.
[[bin]]
name = "Epik"
path = "src/main.rs"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on Windows.
name = "epik_backend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
epik = { path = "../epik", features = ["native", "serde"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
anyhow = "1"
# The scripted model rides in for tests only; no shipping build sees it.
epik = { path = "../epik", features = ["scripted"] }

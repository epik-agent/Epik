[package]
name = "epik-backend"
version = "0.1.0"
edition = "2024"

# The binary carries the product name: macOS reads the running process's name
# into "About …", "Hide …" and "Quit …", and a dev build runs outside a bundle.
[[bin]]
name = "Epik"
path = "src/main.rs"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on Windows.
name = "epik_backend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
epik = { path = "../epik", features = ["native", "serde"] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
serde_json = "1"
toml = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The monitor's HTTP server: blocking, a thread per connection, pure
# Rust, and off the async runtime like the rest of the library.
tiny_http = "0.12"
# The frontend bundle, embedded: a headless backend is one file.
include_dir = "0.7"

[dev-dependencies]
# The scripted model rides in for tests only; no shipping build sees it.
epik = { path = "../epik", features = ["testing"] }

[lints]
workspace = true

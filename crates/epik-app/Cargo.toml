[package]
name = "epik-app"
description = "The Epik app, which runs Epik's builds."
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
serde_json = "1.0.154"
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
epik-core = { path = "../epik-core" }
epik-view = { path = "../epik-view" }
open = "5.4.4"
rust_decimal = { version = "1.43.0", default-features = false }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

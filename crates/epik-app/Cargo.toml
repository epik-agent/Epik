[package]
name = "epik-app"
description = "The Epik app, which runs Epik's builds."
version.workspace = true
edition.workspace = true
publish.workspace = true

# The tray and windows, and keeping the machine awake. Without them, as on
# a server with no desktop, the app always runs headless and links neither
# Tauri nor the libraries it needs.
[features]
default = ["desktop"]
desktop = [
    "dep:chrono",
    "dep:epik-view",
    "dep:open",
    "dep:rust_decimal",
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "epik-core/awake",
]

[build-dependencies]
serde_json = "1.0.154"
tauri-build = { version = "2.7.2", features = [], optional = true }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"], optional = true }
ctrlc = { version = "3.5.2", features = ["termination"] }
epik-core = { path = "../epik-core", default-features = false }
epik-view = { path = "../epik-view", optional = true }
open = { version = "5.4.4", optional = true }
rust_decimal = { version = "1.43.0", default-features = false, optional = true }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-dialog = { version = "2.8.4", optional = true }
tauri-plugin-opener = { version = "2.7.2", optional = true }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[lints]
workspace = true

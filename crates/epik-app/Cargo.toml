[package]
name = "epik-app"
description = "The Epik app, which runs Epik's builds."
version.workspace = true
edition.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
epik-core = { path = "../epik-core" }
open = "5.4.4"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false }
rust_decimal = { version = "1.43.0", default-features = false }
tempfile = "3.27.0"

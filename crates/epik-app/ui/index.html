<!doctype html>
<!-- A run's window: its issues as a dependency graph with their live
     states. Static on purpose: no bundler and no framework. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Epik run</title>
    <link rel="stylesheet" href="run.css" />
    <script src="run.js" defer></script>
  </head>
  <body>
    <header>
      <div class="heading">
        <span id="repo"></span>
        <h1 id="title"></h1>
      </div>
      <dl class="facts">
        <div><dt>State</dt><dd id="status" class="status"></dd></div>
        <div><dt>Elapsed</dt><dd id="elapsed"></dd></div>
        <div><dt>Cost</dt><dd id="cost"></dd></div>
      </dl>
      <p id="reason"></p>
    </header>
    <main>
      <div id="graph">
        <svg id="edges" aria-hidden="true">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" />
            </marker>
          </defs>
        </svg>
        <div id="nodes"></div>
      </div>
      <p id="error"></p>
    </main>
  </body>
</html>

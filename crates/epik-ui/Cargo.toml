[package]
name = "epik-ui"
description = "The Epik app's windows, in Rust, compiled to WebAssembly by trunk."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Trunk turns this on, through `data-cargo-features` in index.html, to build
# the app for the browser. Without it the crate builds natively, for tests.
csr = ["leptos/csr"]

[dependencies]
epik-view = { path = "../epik-view" }
leptos = "0.8.22"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"

[dev-dependencies]
leptos = { version = "0.8.22", features = ["ssr"] }

[lints]
workspace = true

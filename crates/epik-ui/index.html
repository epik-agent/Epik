<!doctype html>
<!-- `data-theme` is set here as well as by the frontend: the first paint
     happens before any wasm has run, and a white flash on the way into a dark
     window is exactly the sort of thing theming-as-an-afterthought produces. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Epik</title>
    <link data-trunk rel="rust" />
    <link data-trunk rel="tailwind-css" href="styles/window.css" />
  </head>
  <body></body>
</html>

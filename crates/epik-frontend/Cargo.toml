[package]
name = "epik-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1"
epik = { path = "../epik", features = ["serde"] }
leptos = { version = "0.8", features = ["csr"] }
# The Markdown grammar. Parser only — Epik renders the events into its
# own typed structure; the HTML output half is never used.
pulldown-cmark = { version = "0.13", default-features = false }
# Syntax highlighting over the pruned grammar set build.rs compiles.
# fancy-regex only: the default onig backend is a C dependency and must
# never appear in the tree.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "dump-load",
] }
serde = { version = "1", features = ["derive"] }
# Already in the tree through epik (unconditional there) and already in
# this lockfile; the line only makes it nameable for the JSON tree.
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Only for features leptos doesn't already enable (matchMedia, and the
# delegated link-click handler's Element walk).
web-sys = { version = "0.3", features = [
    "Element",
    "EventTarget",
    "MediaQueryList",
] }

# Deliberately its own workspace: this crate targets wasm while the root
# workspace targets native, so it must not attach to the root.
[workspace]

# Matches the root workspace's lint, which this manifest cannot inherit.
[lints.rust]
unused_qualifications = "warn"

[build-dependencies]
# build.rs compiles grammars/ into the pruned SyntaxSet dump the
# highlighter embeds. Same pure-Rust regex backend as the runtime.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "yaml-load",
    "dump-create",
] }

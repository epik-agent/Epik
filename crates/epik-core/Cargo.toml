[package]
name = "epik-core"
description = "The logic of the Epik app, tested without a desktop."
version.workspace = true
edition.workspace = true
publish.workspace = true

# Keeping the machine from idle sleep while builds run, which on Linux
# links a D-Bus client. A server with no desktop goes without.
[features]
default = ["awake"]
awake = ["dep:keepawake"]

[dependencies]
agent-client-protocol = { version = "3.6.0", features = ["process"] }
async-io = "2.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
dirs = "7.0.0"
epik-view = { path = "../epik-view" }
flate2 = "1.1.10"
futures = "0.3.34"
interprocess = "2.4.7"
keepawake = { version = "0.6.1", optional = true }
regex-lite = "0.1.9"
rmcp = { version = "3.8", features = ["server", "transport-io"] }
rust_decimal = { version = "1.43.0", default-features = false, features = ["std", "serde-float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std"] }
ureq = "3.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

# A stand-in for claude-agent-acp in this crate's tests. It is not part of
# Epik and is never installed: only epik-app is.
[[bin]]
name = "fake-acp-agent"
test = false
doc = false

[lints]
workspace = true

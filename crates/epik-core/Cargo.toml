[package]
name = "epik-core"
version = "0.1.0"
edition = "2024"

[features]
# The machinery of an actual desktop: process supervision, and the
# runtime a plan's tasks run on. Off by default so the crate stays
# wasm-clean for the frontend.
native = [
    "chrono/clock",
    "dep:include-crypt",
    "dep:libc",
    "dep:tokio",
    "dep:ureq",
]
# Test infrastructure, for this crate's tests and its dependents': the
# scratch directory and the scripted model. No shipping build enables it.
testing = ["native"]

[dependencies]
anyhow = "1.0.104"
# Parsing everywhere, so the vocabulary stays wasm-clean; the clock,
# which only current_time reads, comes with native.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The system prompt, compiled in obfuscated.
include-crypt = { version = "0.1", optional = true }
libc = { version = "0.2", optional = true }
# Where a message's fences are: the parser alone.
pulldown-cmark = { version = "0.13", default-features = false }
# Money is a fixed-precision number, never a float.
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A plan runs its tasks on a JoinSet, counts their processes with a
# semaphore, and sends what blocks to the blocking pool; time is for a
# task's waits. Nothing else here is async.
tokio = { version = "1", features = ["rt", "sync", "macros", "time"], optional = true }
# GitHub, spoken directly and blocking: the host's async is not ours.
ureq = { version = "3", features = ["json"], optional = true }
url = "2"

[lints]
workspace = true

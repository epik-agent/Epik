[package]
name = "epik"
version = "0.1.0"
edition = "2024"

[features]
# The machinery of an actual desktop: the OS keyring, blocking HTTP,
# process supervision. Off by default so the crate stays wasm-clean for
# the frontend. Wire protocols come with it, so native implies serde.
native = [
    "dep:chrono",
    "dep:include-crypt",
    "dep:keyring",
    "dep:libc",
    "dep:toml",
    "dep:ureq",
    "serde",
]
# Wire form for the types both sides of the IPC barrier share — including
# Secret, whose serialization is the one door its bytes leave through. A
# marker: the serde crates themselves are unconditional, because the agent
# vocabulary is wire protocol under every feature set.
serde = []
# The scripted fakes: the loopback model and the deterministic agent, just
# enough behavior to test against. Test infrastructure only — no shipping
# build enables it, and no test in this project ever depends on a real LLM.
scripted = ["native"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
], optional = true }
include-crypt = { version = "0.1", optional = true }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
], optional = true }
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", optional = true }
ureq = { version = "3", features = ["json"], optional = true }

[dev-dependencies]
# The independent git implementation the git.rs tests verify against:
# CLI in prod, libgit2 in tests. Local-only, so no TLS or SSH features.
git2 = { version = "0.20", default-features = false }

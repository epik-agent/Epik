[package]
name = "epik"
version = "0.1.0"
edition = "2024"

[features]
# The OS keyring, for builds that run on an actual desktop. Off by default so
# the crate stays wasm-clean for the frontend.
native = ["dep:keyring"]
# Wire form for the types both sides of the IPC barrier share — including
# Secret, whose serialization is the one door its bytes leave through.
serde = ["dep:serde"]

[dependencies]
anyhow = "1"
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
], optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

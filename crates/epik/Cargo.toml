[package]
name = "epik"
version = "0.1.0"
edition = "2024"

[features]
# The machinery of an actual desktop: the OS keyring, blocking HTTP. Off by
# default so the crate stays wasm-clean for the frontend. Wire protocols
# come with it, so native implies serde.
native = ["dep:include-crypt", "dep:keyring", "dep:ureq", "serde"]
# Wire form for the types both sides of the IPC barrier share — including
# Secret, whose serialization is the one door its bytes leave through.
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
anyhow = "1"
include-crypt = { version = "0.1", optional = true }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "3", optional = true }

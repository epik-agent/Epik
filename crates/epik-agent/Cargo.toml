[package]
name = "epik-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
# Default features only, and by discipline nothing is imported from epik
# but the agent wire vocabulary — no chat, no github, no keystore, no
# domain types. The runner is generic: it knows how to run a command
# line and frame what it observes, and nothing else.
epik = { path = "../epik" }
serde_json = "1"

[dev-dependencies]
# The tests exercise the launcher end and the scripted Agent, both of
# which live in epik's agent module; scripted rides on native.
epik = { path = "../epik", features = ["scripted"] }
libc = "0.2"

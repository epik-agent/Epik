<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!-- Interim app-icon master composed from website/brand: light-theme mark on the
       light root background (#fafafa), macOS-style rounded rect with transparent
       margins. Replace with a designed master when the brand kit grows one, then
       rerun `cargo tauri icon app-icon.svg` from this directory. -->

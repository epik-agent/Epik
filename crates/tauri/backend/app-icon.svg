  <g transform="translate(272 272) scale(7.5)">
    <line x1="16" y1="16" x2="48" y2="24" stroke="#171717" stroke-width="2" opacity="0.25"/>
    <line x1="16" y1="16" x2="24" y2="48" stroke="#171717" stroke-width="2" opacity="0.25"/>
    <line x1="48" y1="24" x2="40" y2="48" stroke="#171717" stroke-width="2" opacity="0.25"/>
    <line x1="24" y1="48" x2="40" y2="48" stroke="#171717" stroke-width="2" opacity="0.25"/>
    <circle cx="16" cy="16" r="6" fill="#00c07a"/>
    <circle cx="48" cy="24" r="5" fill="#171717"/>
    <circle cx="24" cy="48" r="5" fill="#171717"/>
    <circle cx="40" cy="48" r="4" fill="#00c07a" opacity="0.7"/>

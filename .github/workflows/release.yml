# Build Epik's installers when a version tag is pushed, and attach them to
# a draft GitHub Release for a person to publish.
#
# The tag must be `v<version>` or `v<version>-<suffix>`, where <version> is
# epik-app's version (the workspace version in the root Cargo.toml). A tag
# with a suffix, such as `v0.3.0-test`, makes a pre-release.
#
# Every file is uploaded under a name without the version, so the website's
# download buttons can link to
# https://github.com/epik-agent/Epik/releases/latest/download/<file>:
#
#   Epik.dmg              macOS, universal (Apple Silicon and Intel)
#   Epik.msi              Windows, x64
#   Epik_amd64.AppImage   Linux, x86-64
#   Epik_amd64.deb        Linux, x86-64 (Debian, Ubuntu)
#
# and, for running builds on a Linux server (see the record "Remote hosts"
# in docs/design-history), the app without its tray and windows:
#
#   epik-app-linux-x64.tar.gz     Linux, x86-64
#   epik-app-linux-arm64.tar.gz   Linux, ARM64
#
# Each tarball holds the one binary, epik-app, and comes with a .sha256
# that `sha256sum -c` checks. The website doesn't link them; the docs for
# setting up a host do.
#
# The app is built with Tauri's bundler through the Tauri CLI. On macOS
# the build and its check are `cargo xtask dmg` (crates/xtask), so a Mac
# can run the same thing.
#
# macOS signing is armed by secrets and skipped without them: without them
# the workflow still runs and produces an unsigned .dmg. The check after
# the build demands what the secrets promised: a verified signature when
# there was an identity, a notarized and stapled app when there were
# notarization credentials, and a universal binary always.
#
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  the .p12's password
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                    the Apple ID that notarizes the app
#   APPLE_PASSWORD              an app-specific password for that Apple ID
#   APPLE_TEAM_ID               the Developer team's ID
#
# The first three sign the app; the last three, when all are present,
# notarize and staple it. The Tauri CLI reads all of these from the
# environment itself: it imports the certificate into a temporary keychain
# for the build and removes it afterwards.
#
# Windows is unsigned for now, so SmartScreen warns on first run.

name: Release

on:
  push:
    tags: ["v*"]

# Creating the release and uploading its files.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Sets Git's init.defaultBranch for every job, which silences the
  # hint actions/checkout's `git init` prints.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  version:
    name: Tag matches the app's version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "epik-app") | .version')
          echo "epik-app is version $version; the tag is $TAG."
          case "$TAG" in
            "v$version" | "v$version-"?*) ;;
            *)
              echo "::error::The tag $TAG is not v$version or v$version-<suffix>. Bump the workspace version in Cargo.toml, or tag v$version."
              exit 1
              ;;
          esac

  build:
    name: Build (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
            build: cargo xtask dmg
          - os: windows-latest
            targets: wasm32-unknown-unknown
            build: cargo tauri build --bundles msi
          - os: ubuntu-24.04
            targets: wasm32-unknown-unknown
            build: cargo tauri build --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The tray is Tauri, which builds against GTK and WebKitGTK on Linux.
      # The same packages as ci.yml.
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      # The windows are Rust compiled to WebAssembly by trunk, which the
      # Tauri CLI runs as the beforeBuildCommand. trunk's prebuilt release,
      # the same version as ci.yml.
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.14
      # Tauri's prebuilt CLI for the runner, from Tauri's own release:
      # compiling it took 6 to 11 minutes a job. The archive holds
      # cargo-tauri, or cargo-tauri.exe, at its root: a tgz on Linux, a zip
      # elsewhere. Git Bash's tar can't unpack a zip, so zips go to unzip.
      # Not every runner has ~/.cargo/bin, so the CLI gets its own
      # directory on the PATH.
      - name: Install the Tauri CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_CLI: 2.12.4
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          dir="$RUNNER_TEMP/tauri-cli"
          gh release download "tauri-cli-v$TAURI_CLI" --repo tauri-apps/tauri \
            --pattern "cargo-tauri-$target.*" --dir "$dir"
          cd "$dir"
          case "$target" in
            *linux*) tar -xzf "cargo-tauri-$target.tgz" ;;
            *) unzip -q "cargo-tauri-$target.zip" ;;
          esac
          ./cargo-tauri --version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Arm code signing
        if: runner.os == 'macOS'
        # Secrets reach the Tauri CLI only when they exist: an empty
        # APPLE_SIGNING_IDENTITY would be taken as an identity and fail.
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$IDENTITY" ]; then
            echo "::notice::No signing secrets; the .dmg will be unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE<<__EOF__"; echo "$CERT"; echo "__EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$NOTARY_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM" ]; then
            {
              echo "APPLE_ID=$NOTARY_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::No notarization secrets; the .dmg will be signed but not notarized."
          fi

      - name: Bundle
        working-directory: crates/epik-app
        env:
          # The AppImage tool is itself an AppImage, and the runner has no
          # FUSE to mount it: unpack it instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # linuxdeploy's own strip fails on newer Ubuntu libraries.
          NO_STRIP: true
        run: ${{ matrix.build }}

      # Version-free names, so the latest release's download links never
      # change. Each glob must match exactly one file.
      - name: Name the installers
        shell: bash
        run: |
          mkdir dist
          one() {
            # Unquoted on purpose: the shell expands the glob.
            # shellcheck disable=SC2086
            set -- $1
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::Expected one file, found: $*"
              exit 1
            fi
            echo "$1"
          }
          case "$RUNNER_OS" in
            macOS)
              cp "$(one 'target/universal-apple-darwin/release/bundle/dmg/*.dmg')" dist/Epik.dmg
              ;;
            Windows)
              cp "$(one 'target/release/bundle/msi/*.msi')" dist/Epik.msi
              ;;
            Linux)
              cp "$(one 'target/release/bundle/appimage/*.AppImage')" dist/Epik_amd64.AppImage
              cp "$(one 'target/release/bundle/deb/*.deb')" dist/Epik_amd64.deb
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  # The headless app: epik-app without its default `desktop` feature, so
  # no Tauri, GTK or WebKit, and no trunk to build the windows. Each
  # architecture builds on its own runner rather than cross-compiling.
  headless:
    name: Headless (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p epik-app --no-default-features
      # The tarball and its checksum, named for the architecture and not
      # the version. The binary must start on a runner with no GUI
      # packages installed.
      - name: Package
        env:
          NAME: epik-app-linux-${{ matrix.arch }}.tar.gz
        run: |
          mkdir dist
          ./target/release/epik-app --version
          tar -czf "dist/$NAME" -C target/release epik-app
          (cd dist && sha256sum "$NAME" > "$NAME.sha256" && sha256sum -c "$NAME.sha256")
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: installers-headless-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft the release
    needs: [build, headless]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Attach the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          for f in Epik.dmg Epik.msi Epik_amd64.AppImage Epik_amd64.deb \
            epik-app-linux-x64.tar.gz epik-app-linux-x64.tar.gz.sha256 \
            epik-app-linux-arm64.tar.gz epik-app-linux-arm64.tar.gz.sha256; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          # A rerun replaces the files on the release it already made.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* --draft $prerelease \
              --verify-tag --title "Epik ${TAG#v}" --generate-notes
          fi

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    # The branch ruleset requires a status check with this exact context.
    name: CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # Validate the marketplace and plugin manifests the way Claude Code
      # reads them. Not --strict: plugin.json omits `version` on purpose so
      # each commit is a new version, and --strict fails on that warning.
      - run: npm install --global @anthropic-ai/claude-code@2.1.309
      - run: claude plugin validate .
        working-directory: .
      - run: claude plugin validate ./plugin
        working-directory: .

  deploy-website:
    # The website is the deployed version of this project: every push to
    # main that passes CI redeploys it to GitHub Pages.
    name: Deploy website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    # Listing any permission drops the rest to none, and actions/checkout
    # needs contents: read to clone this private repository.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4

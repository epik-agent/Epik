name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    # The branch ruleset requires a status check with this exact context.
    name: CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run python scripts/sync_resources.py --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  deploy-website:
    # The website is the deployed version of this project: every push to
    # main that passes CI redeploys it to GitHub Pages.
    name: Deploy website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    # The branch ruleset requires a status check with this exact context.
    name: CI
    runs-on: ubuntu-latest
    # No step writes to GitHub, and actions/checkout needs contents: read to
    # clone this private repository.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: plugin/server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: plugin/server/package-lock.json
      - run: npm ci
      - run: npm test
      # The committed bundle is what the plugin runs, so it must match its
      # source.
      - run: npm run build
      - run: git diff --exit-code dist
      # Validate the marketplace and plugin manifests the way Claude Code
      # reads them. Not --strict: plugin.json omits `version` on purpose so
      # each commit is a new version, and --strict fails on that warning.
      - run: npm install --global @anthropic-ai/claude-code@2.1.309
      - run: claude plugin validate .
        working-directory: .
      - run: claude plugin validate ./plugin
        working-directory: .

  rust:
    # The Epik app is cross-platform, so its workspace is checked on each
    # platform it runs on.
    # GitHub appends the matrix's os to the name: "Rust (ubuntu-latest)".
    name: Rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      # The tray is Tauri, which builds against GTK and WebKitGTK on Linux.
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deploy-website:
    # The website is the deployed version of this project: every push to
    # main that passes CI redeploys it to GitHub Pages.
    name: Deploy website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    # Listing any permission drops the rest to none, and actions/checkout
    # needs contents: read to clone this private repository.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5
